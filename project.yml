name: MiniAmp
options:
  bundleIdPrefix: dev.miniamp
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
# Signing for both targets: ad-hoc unless Local.xcconfig sets a team.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  MiniAmpKit:
    path: Packages/MiniAmpKit
targets:
  miniamp:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - Shared
      # Resources: the app icon, made in Icon Composer (layers for Liquid Glass; Xcode
      # makes the flat icons for macOS 15 from it).
      - App/Resources
    dependencies:
      - package: MiniAmpKit
      - target: miniampWidget
    info:
      path: App/Info.plist
      properties:
        MiniAmpAppGroup: $(TeamIdentifierPrefix)dev.miniamp
    entitlements:
      path: App/miniamp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Shared with the widget: what's playing, and its cover.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)dev.miniamp
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # LRCLIB lyrics lookups (off until turned on in Settings, or asked for per song).
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: miniamp
        PRODUCT_BUNDLE_IDENTIFIER: dev.miniamp.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: miniamp
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  # The Now Playing widget (WidgetKit), embedded in the app.
  miniampWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: miniamp
        MiniAmpAppGroup: $(TeamIdentifierPrefix)dev.miniamp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/miniampWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)dev.miniamp
    settings:
      base:
        PRODUCT_NAME: miniampWidget
        PRODUCT_BUNDLE_IDENTIFIER: dev.miniamp.app.widget
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  miniamp:
    build:
      targets:
        miniamp: all
    run:
      config: Debug
